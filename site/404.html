<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>페이지 이동 중 | 건물관리 달인명인</title>
<script>
/* 옛 master1.kr(PHP) 주소 → 새 사이트 페이지로 자동 이동
   - 새 사이트에 같은 내용이 있으면 해당 페이지로
   - 로그인·파트너·견적접수·공지처럼 기존 기능은 old.master1.kr 로 */
(function () {
  var OLD = 'https://old.master1.kr';
  var path = location.pathname, q = new URLSearchParams(location.search);
  var base = path.indexOf('/test/') === 0 ? '/test/' : '/';       // github.io/test 미리보기 주소 대응
  var file = path.slice(base.length).toLowerCase();
  var code = (q.get('code') || '').toLowerCase(), id = q.get('id') || '';
  var experts = {'8':'lgp','11':'kks','13':'khj','14':'kkh','15':'jyw','23':'kwr','24':'kms','25':'lec','26':'lh','27':'pcs','28':'hdh','29':'valve'};
  var service = {
    'amp':'fire-construction#broadcast','sutter':'fire-construction#shutter','firerepair':'fire-construction#deficiency',
    'fireinspection':'fire-inspection','insurance':'building#fire-insurance','building management':'building#total',
    'clean':'building#clean','disinfection':'inspection#disinfection','communication':'ict','elevator':'inspection#elevator',
    'electric':'inspection','tank':'inspection#tank','aircon':'inspection#air'
  };
  var inspection = {'function':'fire-safety#inspection','precision':'fire-inspection','safety':'fire-safety#safety-agency',
    'monthly':'fire-safety#inspection','machinic':'inspection#mechanical','disinfection':'inspection#disinfection','저수조':'inspection#tank'};
  var keepOld = /^(login|logout|join|register|partners|request_quote|request_sos|notice|notice_view|privacy|mypage|admin)(\.php)?$/;
  var to = null;
  if (file === 'index.php' || file === 'index.html') to = '';
  else if (file === 'about.php') to = 'story#story';
  else if (file === 'experts.php') to = 'experts';
  else if (file === 'expert_view.php') to = experts[id] ? 'experts#' + experts[id] : 'experts';
  else if (file === 'service_view.php') to = service[code] || '#doors';
  else if (file === 'inspection.php') to = 'inspection';
  else if (file === 'inspection_view.php') to = inspection[code] || 'inspection';
  else if (file === 'selfinspec_view.php') to = 'fire-safety#self';
  else if (file === 'public_view.php') to = '#sits';
  else if (file === 'cases.php' || file === 'case_view.php') to = 'fire-safety#safety-agency';
  else if (file === 'faq.php') to = '#faq';
  else if (keepOld.test(file) || file.indexOf('admin/') === 0) { location.replace(OLD + path + location.search); return; }
  if (to !== null) location.replace(base + to);
})();
</script>

</head><body><div><h1>페이지를 찾을 수 없습니다</h1><p>주소가 바뀌었거나 없는 페이지입니다.</p><a href="./">건물관리 달인명인 홈으로</a></div></body></html>
