# 시설통 사이트 자동 배포 (GitHub Pages)
# main 브랜치에 올라가면 site/ 를 다시 만들어 https://andy202082.github.io/test/ 에 배포합니다.
# 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 선택해야 합니다.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages from src/content.py
        run: python3 src/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
