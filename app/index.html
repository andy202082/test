<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사진통</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📷 사진통</h1>
    <p id="count">사진 0장</p>
  </header>

  <main>
    <label id="dropzone" for="file-input">
      <span>여기를 눌러 사진을 고르거나, 사진을 끌어다 놓으세요</span>
      <input id="file-input" type="file" accept="image/*" multiple hidden>
    </label>

    <p id="empty">아직 사진이 없어요.</p>
    <ul id="gallery"></ul>
  </main>

  <dialog id="viewer">
    <img id="viewer-img" alt="">
    <div class="viewer-bar">
      <span id="viewer-name"></span>
      <button id="delete-btn" class="danger">삭제</button>
      <button id="close-btn">닫기</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
