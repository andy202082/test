<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사진통</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>사진통</h1>
    <div class="header-side">
      <p id="count">사진 0장</p>
      <div id="account" hidden>
        <span id="welcome"></span>
        <button id="signup-btn" class="primary">회원가입</button>
        <button id="edit-btn" hidden>내 정보</button>
      </div>
    </div>
  </header>

  <main>
    <p id="notice" hidden>이 브라우저에서는 사진을 저장할 수 없어요. 새로고침하면 넣은 사진이 사라져요.</p>

    <section class="intake">
      <label id="dropzone" for="file-input">
        <strong>사진 넣기</strong>
        <span>눌러서 고르거나, 사진이나 폴더를 여기로 끌어다 놓으세요</span>
        <input id="file-input" type="file" accept="image/*" multiple hidden>
      </label>
      <label id="folder-btn" class="button" for="folder-input">폴더째로 불러오기</label>
      <input id="folder-input" type="file" webkitdirectory multiple hidden>
    </section>
    <p id="status" role="status"></p>

    <div id="empty">
      <p class="empty-title">통이 비어 있어요</p>
      <p>위의 상자를 눌러 사진을 고르거나, 폴더를 통째로 불러와 보세요.</p>
    </div>
    <ul id="gallery"></ul>

    <section id="members" hidden>
      <h2>회원 <span id="member-count">0</span>명</h2>
      <p id="members-empty">아직 가입한 사람이 없어요. 첫 회원이 되어 보세요.</p>
      <ul id="member-list"></ul>
    </section>
  </main>

  <dialog id="viewer">
    <img id="viewer-img" alt="">
    <div class="viewer-bar">
      <span id="viewer-name"></span>
      <div id="viewer-actions">
        <button id="delete-btn" class="danger">삭제</button>
        <button id="close-btn">닫기</button>
      </div>
      <div id="confirm-actions" hidden>
        <span>이 사진을 삭제할까요?</span>
        <button id="confirm-delete-btn" class="danger">삭제</button>
        <button id="cancel-delete-btn">취소</button>
      </div>
    </div>
  </dialog>

  <dialog id="signup">
    <form id="signup-form" novalidate>
      <h2 id="signup-title">회원가입</h2>
      <p class="hint">claude.ai 계정으로 이미 본인 확인이 되어 있어서 비밀번호는 필요 없어요.</p>
      <label for="nickname">닉네임 <small>2~12자</small></label>
      <input id="nickname" maxlength="12" autocomplete="nickname">
      <label for="intro">한 줄 소개 <small>선택, 40자까지</small></label>
      <input id="intro" maxlength="40">
      <label class="check"><input id="agree" type="checkbox"> 닉네임과 소개가 이 페이지를 여는 사람들에게 보이는 데 동의해요</label>
      <p id="signup-error" role="alert"></p>
      <div id="form-actions" class="form-actions">
        <button type="button" id="withdraw-btn" class="danger-outline" hidden>탈퇴</button>
        <span class="spacer"></span>
        <button type="button" id="signup-cancel">취소</button>
        <button type="submit" id="signup-submit" class="primary">가입하기</button>
      </div>
      <div id="withdraw-confirm" class="form-actions" hidden>
        <span>탈퇴하면 회원 명단에서 빠져요. 탈퇴할까요?</span>
        <span class="spacer"></span>
        <button type="button" id="withdraw-cancel">취소</button>
        <button type="button" id="withdraw-ok" class="danger">탈퇴</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
